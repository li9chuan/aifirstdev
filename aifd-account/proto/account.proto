syntax = "proto3";

package aifd.account;

option go_package = "github.com/li9chuan/aifirstdev/aifd-account/generated/accountpb;accountpb";

// DBAccount stores the durable account-center record for one global account.
message DBAccount {
  int64 account_id = 1;
  AccountStatus status = 2;
  int64 created_at_unix = 3;
  int64 updated_at_unix = 4;
}

// AccountStatus describes whether an account can log in.
enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_DISABLED = 2;
}
