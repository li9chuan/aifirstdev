version: '3'

info:
  companyName: aiFirstDev
  productName: DeskTool
  productIdentifier: com.aifirstdev.desktool
  description: AIFD desktop example
  version: 0.1.0

dev_mode:
  root_path: .
  log_level: info
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, build/bin, build/tmp]
    file: ['*.syso', '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task frontend:dev
      type: background
      readiness:
        http: http://127.0.0.1:5173/
        timeout: 60s
        interval: 200ms
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
