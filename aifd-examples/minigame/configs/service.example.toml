# Single-proxy local default config. Use a per-node proxy_broker.config_file in multi-proxy deployments.

[log]
level = "info"
stdout = true
dir = "./logs"

[log.rotation]
max_size_mb = 1024
# Local calendar-day rotation is enabled by default. Retention is unlimited unless configured.
# max_age_days = 7
# max_backups = 30
# compress = true

# Optional typed CSV Stat, with self-described event types and an application header.
# [log.stat]
# local_path = "./logs/stat.log"
# [log.stat.rotation]
# max_size_mb = 1024

[rpc.nats]
servers = ["nats://127.0.0.1:4222"]
timeout = "3s"
# credentials_file = "./secrets/minigame.creds"
# tls_ca_file = "./secrets/ca.pem"
# tls_cert_file = "./secrets/client.crt"
# tls_key_file = "./secrets/client.key"

[proxy_broker]
enabled = true
config_file = "./configs/nats/proxy-local.conf"
ready_timeout = "10s"
shutdown_timeout = "10s"

[rdb.redis]
addrs = ["127.0.0.1:6379"]
password = ""
dial_timeout = "1s"
read_timeout = "1s"
write_timeout = "1s"

[proxy]
max_message_bytes = 4194304
duplicate_policy = "kick_old"
