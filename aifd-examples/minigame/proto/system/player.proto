syntax = "proto3";

package minigame.system;

option go_package = "github.com/li9chuan/aifirstdev/aifd-examples/minigame/generated/pbmsg;pbmsg";

import "system/auth.proto";
import "game/counter.proto";

message DBPlayer {
  int64 uid = 1;
  int64 register_time = 2;
  int32 login_count = 3;
  string last_session = 4;
  minigame.game.CounterState counter = 5;
  MAuthPayload auth = 6;
}
